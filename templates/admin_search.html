{% extends "base.html" %}
{% block title %}Search — Admin{% endblock %}

{% block content %}
<section class="admin-section">
    <div class="container">
        <div class="card filter-card">
            <form method="GET" action="{{ url_for('admin.admin_dashboard') }}" class="filter-form" id="filterForm">
                <div class="filter-row">
                    <div class="form-group">
                        <label for="q">Search</label>
                        <input type="text" id="q" name="q" value="{{ search }}"
                               placeholder="Tracking #, location, keyword..." maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="">All</option>
                            {% for s in statuses %}
                            <option value="{{ s }}" {% if current_status == s %}selected{% endif %}>{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority" name="priority">
                            <option value="">All</option>
                            {% for p in priorities %}
                            <option value="{{ p }}" {% if current_priority == p %}selected{% endif %}>{{ p }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group filter-actions">
                        <label>&nbsp;</label>
                        <button type="submit" class="btn btn-primary" id="filterBtn">
                            <span class="btn-text"><i class="fa-solid fa-filter"></i> Filter</span>
                            <span class="btn-loader hidden"><span class="mini-spinner white"></span></span>
                        </button>
                        <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-outline">Reset</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
