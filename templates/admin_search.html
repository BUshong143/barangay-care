{% extends "base.html" %}
{% block title %}Search — Admin{% endblock %}

{% block content %}
<section class="admin-section">
    <div class="container" style="max-width: 560px;">
        <header class="admin-dash-header">
            <h1 class="page-title">Search cases</h1>
            <p class="page-subhead">Find a complaint by tracking number, location, or keyword.</p>
        </header>
        <div class="card auth-card" style="max-width: none;">
            <form method="GET" action="{{ url_for('admin.admin_dashboard') }}" class="auth-form" id="filterForm">
                <div class="form-group">
                    <label for="q">Search</label>
                    <input type="text" id="q" name="q" value="{{ search or '' }}"
                           placeholder="Tracking #, location, keyword…" maxlength="100" autofocus>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="">All</option>
                            {% for s in statuses %}
                            <option value="{{ s }}" {% if current_status == s %}selected{% endif %}>{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority" name="priority">
                            <option value="">All</option>
                            {% for p in priorities %}
                            <option value="{{ p }}" {% if current_priority == p %}selected{% endif %}>{{ p }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="wizard-actions">
                    <button type="submit" class="btn btn-primary" id="filterBtn">
                        <span class="btn-text"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i> Search</span>
                        <span class="btn-loader hidden"><span class="mini-spinner white"></span></span>
                    </button>
                    <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-ghost">Reset</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
