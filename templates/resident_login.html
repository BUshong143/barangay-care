{% extends "base.html" %}
{% block title %}Sign in — Barangay Care{% endblock %}
{% block body_class %}has-bottom-nav{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <header class="auth-header">
                <h1>Sign in</h1>
                <p>Access your complaints and submit linked reports.</p>
            </header>
            <form method="POST" class="action-form auth-form" data-loader="Signing in…">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required maxlength="150"
                           placeholder="you@email.com" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="8"
                           placeholder="Your password" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Sign in
                </button>
            </form>
            <p class="auth-footer">
                No account?
                <a href="{{ url_for('public.resident_register') }}">Create one</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
