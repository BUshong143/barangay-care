{% extends "base.html" %}
{% block title %}Create account — Barangay Care{% endblock %}
{% block body_class %}has-bottom-nav{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card auth-card-wide">
            <header class="auth-header">
                <h1>Create account</h1>
                <p>Register to track all your complaints in one place.</p>
            </header>
            <form method="POST" class="action-form auth-form" data-loader="Creating account…">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="full_name">Full name <span class="required">*</span></label>
                    <input type="text" id="full_name" name="full_name" required maxlength="150"
                           placeholder="Juan Dela Cruz" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required maxlength="150"
                           placeholder="you@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="contact">Contact number</label>
                    <input type="text" id="contact" name="contact" maxlength="100"
                           placeholder="09XXXXXXXXX" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" maxlength="255"
                           placeholder="Purok / Street, Barangay">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password <span class="required">*</span></label>
                        <input type="password" id="password" name="password" required minlength="8"
                               placeholder="At least 8 characters" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="password2">Confirm password <span class="required">*</span></label>
                        <input type="password" id="password2" name="password2" required minlength="8"
                               placeholder="Repeat password" autocomplete="new-password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fa-solid fa-check" aria-hidden="true"></i> Create account
                </button>
            </form>
            <p class="auth-footer">
                Already have an account?
                <a href="{{ url_for('public.resident_login') }}">Sign in</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
