{% extends "base.html" %}
{% block title %}Staff Login — Barangay Care{% endblock %}

{% block content %}
<section class="form-section">
    <div class="container">
        <div class="card form-card login-card">
            <div class="login-header">
                <i class="fa-solid fa-lock login-icon"></i>
                <h1>Staff Login</h1>
                <p>Authorized staff only</p>
            </div>
            <form method="POST" action="{{ url_for('admin_login') }}" id="loginForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                           maxlength="50">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    <span class="btn-text"><i class="fa-solid fa-right-to-bracket"></i> Sign In</span>
                    <span class="btn-loader hidden"><span class="mini-spinner white"></span> Signing in...</span>
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
